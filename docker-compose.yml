services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      FLASK_HOST: 0.0.0.0
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
volumes:
  mongo_data:
