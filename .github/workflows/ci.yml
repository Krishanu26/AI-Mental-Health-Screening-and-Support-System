name: CI and end-to-end verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s backend -p "test_*.py" -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGODB_DATABASE: orimind_e2e
      ADMIN_EMAILS: ci-admin@example.com
      OLLAMA_ENABLED: "true"
      OLLAMA_MODEL: llama3.2:1b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Build and start the complete container stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Pull a real Llama model into Ollama
        run: docker compose exec -T ollama ollama pull llama3.2:1b
      - name: Exercise frontend, API, MongoDB and Ollama over HTTP
        run: python tests/e2e_smoke.py
      - name: Collect container logs on success or failure
        if: always()
        run: docker compose logs --no-color || true
      - name: Stop containers and clear the integration-test volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
